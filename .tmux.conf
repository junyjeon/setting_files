# ============================================================
#  tmux config — 처음부터 제대로 시작하기 위한 베이스라인
# ============================================================
#
#  ─ 적용 ──────────────────────────────────────────────────
#  $ ln -sf $(pwd)/.tmux.conf ~/.tmux.conf      # 한 번만
#  $ tmux source-file ~/.tmux.conf              # 즉시 리로드
#
#  ─ 첫날 외울 키 7개 (prefix = 백틱 `) ────────────────────
#  ` |        세로 분할 (좌우)
#  ` -        가로 분할 (위아래)
#  ` h/j/k/l  패널 이동 (vim 방향키)
#  ` c        새 윈도우
#  ` 1/2/3    윈도우 번호로 이동
#  ` [        스크롤/복사 모드 진입 (q 나가기, v→y 복사)
#  ` r        설정 리로드 (이 파일 수정 후)
#
#  ─ 자주 쓰게 되는 키 ─────────────────────────────────────
#  ` n / p    다음 / 이전 윈도우
#  ` ,        현재 윈도우 이름 변경
#  ` x        현재 패널 닫기
#  ` z        현재 패널 풀스크린 토글
#  ` H/J/K/L  패널 크기 조정 (연타 가능)
#  ` d        세션 디태치 (tmux a 로 다시 붙음)
#  ` s        세션 목록 (여러 세션 오가기)
#
#  ─ 진짜 백틱(`)을 입력하려면 ────────────────────────────
#  백틱을 두 번 누르면 됨 (`` → ` 한 글자 전달)
#
# ============================================================


# ─── prefix ───
# Ctrl+b는 손가락이 멀어서 백틱(`)으로 변경
# 진짜 백틱을 입력하고 싶으면 ` 를 두 번 누르면 됨
unbind C-b
set -g prefix `
bind ` send-prefix

# ─── 분할 ───
# 기본 " / % 는 안 외워짐 → | / - 로 직관적으로
# 새 패널은 현재 패널의 경로를 그대로 이어받음
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 새 윈도우도 현재 경로 유지
bind c new-window -c "#{pane_current_path}"

# ─── 패널 이동 (vim 스타일 hjkl) ───
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── 패널 크기 조정 (prefix 후 H/J/K/L 연타) ───
# -r: prefix 다시 안 눌러도 잠시 동안 연타 가능
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── 마우스 ───
# 클릭으로 패널 선택, 드래그로 크기 조정, 휠로 스크롤
set -g mouse on

# ─── 윈도우/패널 번호 1부터 ───
# 키보드에서 1이 0보다 가까움
set -g base-index 1
setw -g pane-base-index 1
# 윈도우 닫으면 번호 자동 재정렬 (3,5,7 → 1,2,3)
set -g renumber-windows on

# ─── 히스토리 ───
# 기본 2000줄은 너무 적음
set -g history-limit 50000

# ─── ESC 지연 제거 ───
# vim에서 ESC 누를 때 한 박자 늦게 반응하는 문제 해결
set -sg escape-time 10

# ─── 터미널 색상 ───
# 256색 + true color (현대 터미널 기본 권장)
# 만약 일부 원격에서 색이 깨지면 "screen-256color" 로 바꿔보기
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ─── 포커스 이벤트 ───
# vim autoread 등 외부 변경 감지에 필요
set -g focus-events on

# ─── 복사 모드: vim 키 ───
# prefix [ 로 진입 → v 선택 → y 복사 → 자동으로 빠져나옴
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ─── 설정 리로드 ───
# 설정 바꾼 뒤 prefix r 만 누르면 즉시 반영
bind r source-file ~/.tmux.conf \; display "Reloaded!"
